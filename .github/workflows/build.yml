name: build

on:
  push:
    branches: [ main, modulith, modulith-gradle-modules ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      # Tests use Testcontainers (Postgres, RabbitMQ, Mailpit); Docker is preinstalled on ubuntu-latest.
      - run: ./gradlew build --no-daemon --continue
      # The shared events library must publish cleanly - and with zero dependencies.
      - name: Publish events library to the local Maven repository and check its POM
        run: |
          ./gradlew :events:publishToMavenLocal --no-daemon
          POM=~/.m2/repository/com/example/outboxdemo/outbox-demo-events/0.1.0/outbox-demo-events-0.1.0.pom
          cat "$POM"
          if grep -q '<dependency>' "$POM"; then echo "events library must have no dependencies"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
