spring:
  application:
    name: outbox-demo
  threads:
    virtual:
      enabled: true
  rabbitmq:
    # Externalisation to RabbitMQ also waits for broker confirms.
    publisher-confirm-type: simple
  mail:
    host: localhost
    port: 1025
  modulith:
    events:
      jdbc:
        # Creates the event_publication table - the outbox - at startup.
        schema-initialization:
          enabled: true
      # Incomplete publications (listener failed, or the app died mid-delivery) are re-delivered on
      # restart. Delivery is therefore at-least-once: listeners should be idempotent.
      republish-outstanding-events-on-restart: true

logging:
  level:
    com.example.outboxdemo: debug
