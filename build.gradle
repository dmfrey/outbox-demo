import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
	id 'org.springframework.boot' version '4.1.2' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
	modulithVersion = '2.1.2'
}

allprojects {
	group = 'com.example.outboxdemo'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java-library'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
	}

	// The Spring Boot Gradle plugin adds -parameters only to projects it is applied to. The module
	// libraries do not apply it, yet Spring MVC needs parameter names (e.g. @PathVariable UUID id).
	tasks.withType(JavaCompile).configureEach {
		options.compilerArgs.add('-parameters')
	}

	tasks.withType(Test).configureEach {
		useJUnitPlatform()
	}
}

// Everything except the 'events' library uses Spring, so it gets the Spring Boot and Spring
// Modulith version management. 'events' deliberately gets neither: it has no dependencies.
configure(subprojects.findAll { it.name != 'events' }) {
	apply plugin: 'io.spring.dependency-management'

	dependencyManagement {
		imports {
			mavenBom SpringBootPlugin.BOM_COORDINATES
			mavenBom "org.springframework.modulith:spring-modulith-bom:${rootProject.ext.modulithVersion}"
		}
	}

	dependencies {
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}
}
